name: racing-collect

# Pull GB/IRE racecards + odds every 15 min across the racing day. Each runner's
# per-bookmaker odds (and the API's own price history) are captured, so we build
# a full movement series. Idempotent: repeated polls never duplicate.
on:
  schedule:
    - cron: "*/30 10-20 * * *"     # every 30 min, 10:00-20:59 UTC
  workflow_dispatch:
    inputs:
      date:
        description: "Override date (YYYY-MM-DD), blank = today"
        required: false
        default: ""

concurrency:
  group: racing-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect racecards + odds
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RACING_API_USERNAME:  ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD:  ${{ secrets.RACING_API_PASSWORD }}
          RACING_MODE:          "racecards"
          REGION_CODES:         "gb,ire"
          DATE:                 ${{ github.event.inputs.date }}
        run: python racing.py
