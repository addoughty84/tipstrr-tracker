name: racing-collect

# Poll GB/IRE racecards + odds every 15 minutes, around the clock, pulling
# TODAY and TOMORROW's cards. Tips arrive ~5pm the day before, so tomorrow's
# card is under watch from the evening before right through to each race's
# off-time. Finished races drop out of the feed automatically, so we stop
# polling their odds. Per-bookmaker price history is captured -> odds movement.
# Idempotent: repeated polls only add genuine price changes, never duplicates.
on:
  schedule:
    - cron: "*/15 * * * *"        # every 15 minutes (finer odds-movement resolution)
  workflow_dispatch:
    inputs:
      date:
        description: "Override single date (YYYY-MM-DD), blank = today+tomorrow"
        required: false
        default: ""

concurrency:
  group: racing-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect racecards + odds (today + tomorrow)
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RACING_API_USERNAME:  ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD:  ${{ secrets.RACING_API_PASSWORD }}
          RACING_MODE:          "racecards"
          REGION_CODES:         "gb,ire"
          DAYS_AHEAD:           "1"
          DATE:                 ${{ github.event.inputs.date }}
        run: python racing.py
