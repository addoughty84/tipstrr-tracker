name: edge-researcher
# Phase 2: LLM proposes candidate theories -> testable ones go through the same
# backtest/holdout/paper discipline; data gaps are logged for enrichment.
on:
  schedule:
    - cron: "0 7 * * *"      # daily 07:00 UTC
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r edge/requirements.txt
      - name: Research edges
        working-directory: edge
        env:
          SUPABASE_DB_URL:    ${{ secrets.SUPABASE_DB_URL }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          RESEARCHER_MAX_CALLS: "1"
        run: python researcher.py
