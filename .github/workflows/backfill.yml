name: tipstrr-backfill

# Hands-off staged backfill. Runs every 3 hours and advances the
# 10 -> 30 -> 60 -> 90 -> 180 -> lifetime windows. Each run works for up to
# ~5 hours then stops cleanly; the next run resumes (idempotent, so finished
# work is skipped). Once history is complete you can disable this workflow —
# the daily workflow keeps everything current.

on:
  schedule:
    - cron: "15 */3 * * *"      # every 3 hours
  workflow_dispatch:

concurrency:
  group: tipstrr-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run staged backfill (time-boxed)
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAX_RUNTIME_MIN:      "300"
        run: python backfill.py
