name: tipstrr-backfill

# Single-runner staged backfill (reliable allocation; the 12-job matrix was
# stalling in the queue). Time-boxed to ~5h per run and auto-resumes every 6h
# until full history is in (idempotent — finished work is skipped). Once the
# tipster history is complete you can disable this workflow; the daily scrape
# keeps everything current.
on:
  schedule:
    - cron: "0 */6 * * *"     # every 6 hours, resumes until complete
  workflow_dispatch:

concurrency:
  group: tipstrr-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Staged backfill (time-boxed, resumes next run)
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAX_RUNTIME_MIN:      "300"
        run: python backfill.py
