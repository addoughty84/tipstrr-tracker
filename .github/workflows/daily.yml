name: tipstrr-daily-scrape

on:
  schedule:
    # 23:30 UTC daily — after UK racing has settled. Adjust as you like.
    # (GitHub cron is always UTC.)
    - cron: "30 23 * * *"
  workflow_dispatch:          # lets you run it manually from the Actions tab
    inputs:
      full_backfill:
        description: "Re-scrape full history for every tipster (1 = yes)"
        required: false
        default: "0"
      only_slugs:
        description: "Comma-separated slugs to limit the run (optional)"
        required: false
        default: ""

# Never let two runs overlap (e.g. a slow run + the next schedule).
concurrency:
  group: tipstrr-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scraper
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FULL_BACKFILL:        ${{ github.event.inputs.full_backfill }}
          ONLY_SLUGS:           ${{ github.event.inputs.only_slugs }}
        run: python scraper.py
